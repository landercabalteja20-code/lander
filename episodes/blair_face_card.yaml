# "What's It Like to Have a Big Forehead and Thin Hair... But an Ethereal Face Card?"
# v2: fast cut (~1:50) | native 9:16 | expressive voices
#
# Render:  .venv/bin/python -m studio episodes/blair_face_card.yaml
# Review:  .venv/bin/python -m studio episodes/blair_face_card.yaml --sheet
#
# Consistency rule from the script: Blair's big forehead, thin hair density, face and outfit never change.
# Only the *arrangement* of her hair changes (hair `style:`), plus temporary wind / volume.
#
# Voices: tts: chatterbox (expressive). Per line: emotion 0.3 calm .. 1.6 shouting, pace 0.25 fast .. 0.5 slow.
# Lines marked "# ad-lib" are extra reactions added for energy - delete them for a script-only cut.

title: "What's It Like to Have a Big Forehead and Thin Hair... But an Ethereal Face Card?"
fps: 24
size: [1080, 1920]
tts: chatterbox
bokeh_cu: 0.5
grade: {bloom: 0.24, grain: 0.06, saturation: 1.14, contrast: 1.06, sharpen: 0.4}
captions:
  enabled: true
  size: 78
  highlight: {forehead: "#ffd36a", hair: "#ff9fd6", card: "#ff7ac3", unlimited: "#ff7ac3", volume: "#c9b0ff",
              wind: "#9fd8ff", hater: "#9fd8ff", pretty: "#ff9fd6", gorgeous: "#ffd36a", out: "#ffd36a",
              flaw: "#ff7ac3", grape: "#c9b0ff"}
music:
  seed: 11
  volume: 0.38
  sections:
    - {at: 0, style: pop}
    - {shot: s3_mission, style: comedy}
    - {shot: s5_room, style: sad}
    - {shot: s6_burst, style: warm}
    - {shot: s7_arrive, style: party}

cast:
  blair:
    voice: af_heart
    aura: 0.5
    emotion: 0.85
    pace: 0.35
    speed: 1.06
    look: {skin: "#e7bf92", eye: "#a9b7c6", lips: "#f2669e", eyeshadow: "#d9b8ff", hair: "#8b7b70",
           hair_style: thin, part: -10, forehead: 1.0, eye_shape: feline, glow: 0.9, brow: "#5a4a44",
           top: corset, top_color: "#ff86bf", jacket: "#c9b0ff", bottom: mini, bottom_color: "#c7cbd6",
           bottom_metal: true, shoes: clear, earrings: silver}
  pink:
    voice: af_bella
    emotion: 1.0
    pace: 0.35
    speed: 1.06
    look: {skin: "#6b4028", eye: "#5a3a22", lips: "#c4366e", eyeshadow: "#ff7ac3", hair: "#24160f", hair_style: curly,
           top: halter, top_color: "#ff6fb5", bottom: mini, bottom_color: "#ff8fc8", shoes_color: "#ff6fb5",
           earrings: gold, brow: "#1e120c", glow: 0.4}
  blue:
    voice: af_kore
    emotion: 0.85
    pace: 0.4
    speed: 1.04
    look: {skin: "#f3d2b8", eye: "#3b2a20", lips: "#e8507a", eyeshadow: "#9fd0ff", hair: "#1b1820", hair_style: long,
           bangs: true, eye_shape: almond, part: 0, top: hoodie, top_color: "#8ec5ff", bottom: flare,
           bottom_color: "#bcd8f7", shoes_color: "#ffffff", earrings: silver, brow: "#1b1418", glow: 0.4}
  gold:
    voice: bf_isabella
    emotion: 1.0
    pace: 0.35
    speed: 1.06
    look: {skin: "#c98f62", eye: "#6b4a2a", lips: "#d9506a", eyeshadow: "#ffd36a", hair: "#4a2c1c", hair_style: long,
           wavy: 1.0, part: 12, top: halter, top_color: "#f4c542", top_metal: true, bottom: mini,
           bottom_color: "#f4c542", bottom_metal: true, shoes_color: "#f4c542", earrings: gold, brow: "#2a1a12",
           glow: 0.4}

shots:
  # ======================================================= 1 - WHAT'S IT LIKE?
  - id: s1_open
    set: vanity
    mask: heart
    actors:
      - {who: blair, x: 720, y: 430, s: 0.6, expr: dreamy, face: {tilt: -6}}
    camera: {frame: cu, on: blair, push: 0.1}
    hook: {lines: ["WHAT'S IT LIKE...", "big forehead + thin hair", "but an ethereal", "FACE CARD?"], dur: 2.9}
    glitter: 0.35
    beats:
      - {at: 1.3, who: blair, expr: love, face: {wink: 1.0}}
      - {at: 1.3, who: blair, fx: sparkles, fxdur: 1.5}
    lines:
      - {who: blair, text: "Mwah.", emotion: 0.9, at: 1.4}   # ad-lib
    dur: 3.0
    sfx: [{at: 0.0, name: sparkle, gain: 0.7}]

  - id: s1_eyes
    set: vanity
    actors:
      - {who: blair, x: 720, y: 430, s: 0.6, expr: confident, face: {sparkle: 1.0, tilt: 4}}
    camera: {frame: ecu, on: blair, dy: -20, push: 0.16, rot: -3}
    sfx: [{at: 0.05, name: ding, gain: 0.5}]
    dur: 0.9

  - id: s1_lips
    set: vanity
    actors:
      - {who: blair, x: 720, y: 430, s: 0.6, expr: soft, face: {smile: 0.6}}
    camera: {frame: ecu, on: blair, dy: 70, push: 0.14, rot: 3}
    sfx: [{at: 0.05, name: sparkle, gain: 0.4}]
    dur: 0.9

  - id: s1_notice
    set: vanity
    actors:
      - {who: blair, x: 720, y: 430, s: 0.6, expr: happy}
    camera: {frame: mcu, on: blair, push: 0.06}
    fg: vanity
    beats:
      - {at: 0.5, who: blair, expr: gasp, face: {look_y: -1.0}}
      - {at: 0.5, sfx: dun, gain: 0.6}
    lines:
      - {who: blair, text: "Wait... what?", emotion: 0.9, at: 0.5, bleed: true}   # ad-lib
    dur: 1.4

  - id: s1_forehead
    set: vanity
    actors:
      - {who: blair, x: 720, y: 430, s: 0.6, expr: gasp, face: {look_y: -1.0}}
    camera: {frame: ecu, on: blair, dy: -90, push: 0.12}
    beats:
      - {at: 0.15, who: blair, fx: shine, fxdur: 1.0, sfx: ding, gain: 0.7}
      - {at: 0.15, fx: punch}
    dur: 1.1

  - id: s1_line
    set: vanity
    actors:
      - {who: blair, x: 720, y: 430, s: 0.6, expr: confident, face: {tilt: -3}}
    camera: {frame: cu, on: blair, push: 0.08}
    lines:
      - {who: blair, text: "What's it like having a face card that never declines... but hair that never cooperates?",
         at: 0.1, emotion: 0.95}
    beats:
      - {at: "line1+2.1", who: blair, expr: deadpan, fluff: -0.3, tdur: 0.4}
      - {at: "line1+2.1", sfx: deflate, gain: 0.5}
    tail: 0.25

  # ======================================================= 2 - WIND IS THE ENEMY
  - id: s2_strut
    set: street_glam
    whip_in: true
    actors:
      - {who: blair, x: 560, y: 420, s: 0.62, expr: confident, walk: true, move: [260, 0], face: {smirk: 0.5}}
    camera: {frame: full, on: blair, push: 0.04}
    lines:
      - {who: blair, text: "Okay, runway.", emotion: 1.0, at: 0.3}   # ad-lib
    dur: 1.8
    sfx: [{at: 0.0, name: whoosh, gain: 0.6}]

  - id: s2_flip
    set: street_glam
    actors:
      - {who: blair, x: 820, y: 420, s: 0.62, expr: confident, walk: true, move: [60, 0], face: {sparkle: 0.8, tilt: 5}}
    camera: {frame: mcu, on: blair, push: 0.06, rot: -2}
    beats:
      - {at: 0.15, who: blair, arms: custom, arm_r: [130, 40, 1, true]}
      - {at: 0.3, who: blair, fx: sparkles, fxdur: 1.2, sfx: sparkle, gain: 0.5}
    dur: 1.3

  - id: s2_gust
    set: street_glam
    actors:
      - {who: blair, x: 860, y: 420, s: 0.62, expr: confident}
    camera: {frame: ms, on: blair, push: 0.03}
    beats:
      - {at: 0.15, fx: wind, fxdur: 1.4}
      - {at: 0.1, sfx: whoosh}
      - {at: 0.2, who: blair, wind: 1.0, tdur: 0.25, expr: shock}
      - {at: 0.2, fx: shake, fxdur: 0.7}
    dur: 1.2

  - id: s2_exposed
    set: street_glam
    actors:
      - {who: blair, x: 860, y: 420, s: 0.62, expr: panic, wind: 1.0}
    camera: {frame: ecu, on: blair, dy: -40, push: 0.14, rot: 4}
    beats:
      - {at: 0.0, fx: wind, fxdur: 1.5}
      - {at: 0.0, fx: speed, fxdur: 1.3}
      - {at: 0.3, who: blair, fx: shine, fxdur: 0.9, sfx: ding, gain: 0.6}
    lines:
      - {who: blair, text: "No no no no!", emotion: 1.4, pace: 0.25, at: 0.1, bleed: true}   # ad-lib
    dur: 1.3

  - id: s2_hold
    set: street_glam
    actors:
      - {who: blair, x: 860, y: 420, s: 0.62, expr: panic, wind: 1.0}
    camera: {frame: mcu, on: blair, push: 0.06}
    beats:
      - {at: 0.0, fx: wind, fxdur: 1.6}
      - {at: 0.05, who: blair, arms: custom, arm_r: [124, -10, 1, true], arm_l: [-124, -10, 1, true]}
      - {at: 0.1, who: blair, wind: 0.65, tdur: 0.3}
      - {at: 0.5, fx: shake, fxdur: 0.5}
      - {at: 0.5, sfx: boing, gain: 0.5}
    dur: 1.4

  - id: s2_line
    set: street_glam
    actors:
      - {who: blair, x: 860, y: 420, s: 0.62, expr: angry, wind: 0.65, arms: custom, arm_r: [124, -10, 1, true],
         arm_l: [-124, -10, 1, true], face: {look_y: -0.8}}
    camera: {frame: cu, on: blair, push: 0.12, rot: -3}
    lines:
      - {who: blair, text: "WHY IS THE WIND MY BIGGEST HATER?!", say: "Why is the wind my biggest hater?!", at: 0.05,
         emotion: 1.4, pace: 0.25, seed: 3}
    beats:
      - {at: 0.0, fx: wind, fxdur: 4.0}
      - {at: 0.4, fx: punch}
      - {at: 0.4, fx: shake, fxdur: 0.5}
    tail: 0.15

  - id: s2_after
    set: street_glam
    actors:
      - {who: blair, x: 860, y: 420, s: 0.62, expr: deadpan, wind: 0.65}
    camera: {frame: mcu, on: blair, push: 0.04}
    beats:
      - {at: 0.1, who: blair, wind: 0.0, tdur: 0.5, bounce: true}
      - {at: 0.1, sfx: deflate, gain: 0.5}
    lines:
      - {who: blair, text: "Cool. Love that for me.", emotion: 0.4, pace: 0.4, at: 0.6}   # ad-lib
    tail: 0.2

  # ======================================================= 3 - FLAT HAIR EVERYDAY
  - id: s3_mission
    set: vanity
    whip_in: true
    actors:
      - {who: blair, x: 720, y: 430, s: 0.6, expr: confident, arms: hip, face: {tilt: 4}}
    camera: {frame: mcu, on: blair, push: 0.06}
    fg: vanity
    label: "OPERATION: VOLUME"
    lines:
      - {who: blair, text: "Operation volume. Let's go.", emotion: 1.0, at: 0.15}   # ad-lib
    sfx: [{at: 0.0, name: whoosh, gain: 0.5}, {at: 0.1, name: pop, gain: 0.6}]
    tail: 0.1

  - id: s3_mousse
    set: product
    product: mousse
    lines:
      - {who: blair, text: "First, mousse.", emotion: 0.9, at: 0.0, bleed: true}   # ad-lib
    sfx: [{at: 0.0, name: pop, gain: 0.6}]
    dur: 0.8

  - id: s3_apply
    set: vanity
    actors:
      - {who: blair, x: 720, y: 430, s: 0.6, expr: suspicious, arms: custom, arm_r: [130, 40, 1, true], prop: mousse}
    camera: {frame: mcu, on: blair, push: 0.06}
    fg: vanity
    beats:
      - {at: 0.2, who: blair, fluff: 0.2, tdur: 0.6}
    dur: 0.9

  - id: s3_curler
    set: product
    product: curler
    lines:
      - {who: blair, text: "Then, curl.", emotion: 0.9, at: 0.0, bleed: true}   # ad-lib
    sfx: [{at: 0.0, name: pop, gain: 0.6}]
    dur: 0.7

  - id: s3_curl
    set: vanity
    actors:
      - {who: blair, x: 720, y: 430, s: 0.6, expr: confident, fluff: 0.2, arms: custom, arm_r: [140, 30, 1, true],
         prop: curler}
    camera: {frame: mcu, on: blair, push: 0.06}
    fg: vanity
    beats:
      - {at: 0.1, who: blair, fluff: 0.5, tdur: 0.8}
      - {at: 0.1, sfx: slide_up, gain: 0.4}
    dur: 0.9

  - id: s3_spray_item
    set: product
    product: spray
    lines:
      - {who: blair, text: "Now... hairspray!", emotion: 1.1, pace: 0.35, seed: 3, at: 0.0, bleed: true}   # ad-lib
    sfx: [{at: 0.0, name: whoosh, gain: 0.4}]
    dur: 0.7

  - id: s3_spray
    set: vanity
    actors:
      - {who: blair, x: 720, y: 430, s: 0.6, expr: happy, fluff: 0.5, arms: custom, arm_r: [150, 20, 1, true],
         prop: spray}
    camera: {frame: mcu, on: blair, push: 0.08}
    fg: vanity
    beats:
      - {at: 0.25, who: blair, fluff: 1.0, tdur: 0.5, bounce: true, fx: burst}
      - {at: 0.25, sfx: tada, gain: 0.6}
    dur: 1.0

  - id: s3_fluffy
    set: vanity
    actors:
      - {who: blair, x: 720, y: 430, s: 0.6, expr: squeal, fluff: 1.0, arms: cheeks}
    camera: {frame: cu, on: blair, push: 0.08, rot: 2}
    label: "VOLUME: ON"
    label_color: "#b98cff"
    beats:
      - {at: 0.0, who: blair, fx: hearts, fxdur: 3.0}
      - {at: 0.0, who: blair, fx: sparkles, fxdur: 3.0}
      - {at: 1.2, who: blair, expr: love}
    glitter: 0.45
    lines:
      - {who: blair, text: "Yes! Volume! Look at her!", emotion: 1.4, pace: 0.3, at: 0.2}   # ad-lib
    dur: 3.0

  - id: s3_collapse
    set: vanity
    actors:
      - {who: blair, x: 720, y: 430, s: 0.6, expr: love, fluff: 1.0}
    camera: {frame: cu, on: blair, push: 0.05}
    beats:
      - {at: 0.1, who: blair, fluff: 0.0, tdur: 0.9, bounce: true}
      - {at: 0.1, sfx: deflate, gain: 0.8}
      - {at: 0.25, who: blair, expr: shock}
      - {at: 1.1, who: blair, expr: deadpan}
    lines:
      - {who: blair, text: "No... no no no.", emotion: 1.1, at: 0.35, bleed: true}   # ad-lib
    dur: 1.6

  - id: s3_line
    set: vanity
    actors:
      - {who: blair, x: 720, y: 430, s: 0.6, expr: deadpan, face: {tilt: 3}}
    camera: {frame: cu, on: blair, push: 0.08}
    lines:
      - {who: blair, text: "My hair has ZERO commitment issues... because it never commits to volume!",
         say: "My hair has zero commitment issues... because it never commits to volume!", at: 0.15, emotion: 0.9}
    beats:
      - {at: "line1+2.0", who: blair, expr: smug}
    tail: 0.25

  # ======================================================= 4 - EVERY HAIRSTYLE FAILS
  - id: s4_intro
    set: backdrop
    whip_in: true
    actors:
      - {who: blair, x: 720, y: 380, s: 0.66, expr: confident, arms: hip, face: {tilt: -4}}
    camera: {frame: ms, on: blair, push: 0.05}
    label: "HAIR TRY-ON"
    sfx: [{at: 0.0, name: whoosh, gain: 0.5}, {at: 0.1, name: pop, gain: 0.6}]
    dur: 1.1

  - id: s4_pony
    set: backdrop
    actors:
      - {who: blair, x: 720, y: 380, s: 0.66, expr: confident, style: ponytail}
    camera: {frame: cu, on: blair, push: 0.06}
    label: "SLEEK PONYTAIL"
    beats:
      - {at: 0.0, who: blair, fx: poof, sfx: pop, gain: 0.6}
      - {at: 0.7, who: blair, fx: shine, fxdur: 0.9, sfx: ding, gain: 0.7}
      - {at: 0.8, who: blair, expr: deadpan, face: {look_y: -0.8}}
    lines:
      - {who: blair, text: "Pony? ...Nope.", emotion: 0.7, at: 0.2}   # ad-lib
    tail: 0.15

  - id: s4_middle
    set: backdrop
    actors:
      - {who: blair, x: 720, y: 380, s: 0.66, expr: confident, style: middle}
    camera: {frame: cu, on: blair, push: 0.06, rot: -2}
    label: "MIDDLE PART"
    beats:
      - {at: 0.0, who: blair, fx: poof, sfx: pop, gain: 0.6}
      - {at: 0.6, who: blair, fluff: -0.35, tdur: 0.35, sfx: deflate, gain: 0.6}
      - {at: 0.7, who: blair, expr: deadpan}
    lines:
      - {who: blair, text: "Flat.", emotion: 0.5, at: 0.9}   # ad-lib
    tail: 0.2

  - id: s4_bangs
    set: backdrop
    actors:
      - {who: blair, x: 720, y: 380, s: 0.66, expr: happy, style: bangs}
    camera: {frame: cu, on: blair, push: 0.06, rot: 2}
    label: "CURTAIN BANGS"
    beats:
      - {at: 0.0, who: blair, fx: poof, sfx: pop, gain: 0.6}
      - {at: 0.5, who: blair, wind: 0.45, tdur: 0.25}
      - {at: 0.5, sfx: squeak, gain: 0.6}
      - {at: 0.75, sfx: squeak, gain: 0.6}
      - {at: 0.6, who: blair, expr: nervous, face: {look_y: -0.7}}
    lines:
      - {who: blair, text: "Why are they separating?!", emotion: 1.3, pace: 0.3, at: 0.7}   # ad-lib
    tail: 0.15

  - id: s4_bun
    set: backdrop
    actors:
      - {who: blair, x: 720, y: 380, s: 0.66, expr: confident, style: bun}
    camera: {frame: cu, on: blair, push: 0.06}
    label: "MESSY BUN"
    beats:
      - {at: 0.0, who: blair, fx: poof, sfx: pop, gain: 0.6}
      - {at: 0.5, who: blair, expr: gasp, face: {look_y: -1.0}}
      - {at: 0.5, sfx: squeak, gain: 0.7}
      - {at: 0.5, fx: punch}
    lines:
      - {who: blair, text: "It's a grape.", emotion: 0.5, pace: 0.4, at: 0.8}   # ad-lib
    tail: 0.25

  - id: s4_frenzy
    set: backdrop
    actors:
      - {who: blair, x: 720, y: 380, s: 0.66, expr: panic, style: ponytail}
    camera: {frame: cu, on: blair, push: 0.12, rot: -4}
    beats:
      - {at: 0.0, fx: speed, fxdur: 1.4}
      - {at: 0.25, who: blair, style: middle, fx: poof, sfx: pop, gain: 0.5}
      - {at: 0.5, who: blair, style: bangs, fx: poof, sfx: pop, gain: 0.5}
      - {at: 0.75, who: blair, style: bun, fx: poof, sfx: pop, gain: 0.5}
      - {at: 1.0, who: blair, style: thin, fx: poof, sfx: pop, gain: 0.5}
    dur: 1.25

  - id: s4_line
    set: backdrop
    actors:
      - {who: blair, x: 720, y: 380, s: 0.66, expr: angry, arms: shrug}
    camera: {frame: mcu, on: blair, push: 0.1}
    lines:
      - {who: blair, text: "CAN ONE HAIRSTYLE JUST LOVE ME BACK?!", say: "Can one hairstyle just love me back?!",
         at: 0.05, emotion: 1.5, pace: 0.25, seed: 2}
    beats:
      - {at: 0.5, fx: punch}
      - {at: 0.5, fx: shake, fxdur: 0.5}
    tail: 0.2

  - id: s4_slump
    set: backdrop
    actors:
      - {who: blair, x: 720, y: 380, s: 0.66, expr: sad}
    camera: {frame: ms, on: blair, push: -0.04}
    beats:
      - {at: 0.1, who: blair, fluff: -0.25, tdur: 0.6}
    tint: "#3a2a7a@0.18"
    dur: 1.3

  # ======================================================= 5 - THE BREAKDOWN
  - id: s5_room
    set: bedroom_night
    actors:
      - {who: blair, x: 720, y: 430, s: 0.62, expr: sad, arms: custom, arm_r: [40, 270, -1, false], prop: photo,
         face: {look_y: 0.7}}
    camera: {frame: ws, x: 720, push: 0.08}
    fg: duvet
    dur: 1.8

  - id: s5_photos_a
    set: photos
    hand: blair
    photo_dur: 1.15
    photos:
      - {style: curly, hair: "#2b1a14", skin: "#8a5536", top_color: "#ffd36a", bg: "#ffe1a8", caption: "goals", rot: -4}
      - {style: wavy, hair: "#b8742c", skin: "#f1c7a5", top_color: "#ff8fc8", bg: "#ffd1ec", caption: "volume??", rot: 3}
    dur: 2.3

  - id: s5_sad_cu
    set: bedroom_night
    actors:
      - {who: blair, x: 720, y: 430, s: 0.62, expr: sad, face: {look_y: 0.8}}
    camera: {frame: cu, on: blair, push: 0.07}
    tint: "#2a2266@0.12"
    dur: 1.3

  - id: s5_photos_b
    set: photos
    hand: blair
    tears: true
    photo_dur: 1.15
    photos:
      - {style: long, hair: "#1b1820", skin: "#f3d2b8", top_color: "#8ec5ff", bg: "#cfe6ff", caption: "so thick", rot: 2}
      - {style: curly, hair: "#5a2e1a", skin: "#c98f62", top_color: "#c9b6ff", bg: "#eadbff", caption: "how??", rot: -3}
    dur: 2.3

  - id: s5_line
    set: bedroom_night
    actors:
      - {who: blair, x: 720, y: 430, s: 0.62, expr: cry, face: {tears: 0.8}}
    camera: {frame: cu, on: blair, push: 0.06}
