    actors:
      - {who: blair, x: 720, y: 430, s: 0.6, expr: soft, face: {smile: 0.5}}
    camera: {frame: ecu, on: blair, dy: 70, push: 0.1}
    fg: vanity
    dur: 1.6

  - id: s1_smile
    set: vanity
    actors:
      - {who: blair, x: 720, y: 430, s: 0.6, expr: happy}
    camera: {frame: mcu, on: blair, push: 0.05}
    fg: vanity
    beats:
