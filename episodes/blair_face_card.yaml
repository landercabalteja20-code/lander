    camera: {frame: mcu, on: blair, push: 0.04}
    fg: vanity
    beats:
      - {at: 0.4, who: blair, fluff: -0.3, tdur: 0.4, sfx: deflate, gain: 0.6}
    dur: 2.4

  - id: s1_line
    set: vanity
    actors:
      - {who: blair, x: 720, y: 430, s: 0.6, expr: confident, fluff: -0.3}
    camera: {frame: cu, on: blair, push: 0.06}
    lines:
      - {who: blair, text: "What's it like having a face card that never declines... but hair that never cooperates?",
         at: 0.3}
    beats:
      - {at: "line1+2.6", who: blair, expr: deadpan}
    tail: 0.7

