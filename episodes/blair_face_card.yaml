# "What's It Like to Have a Big Forehead and Thin Hair... But an Ethereal Face Card?"
# 3 minutes | native 9:16 | comedy, emotional, friendship
#
# Render:  .venv/bin/python -m studio episodes/blair_face_card.yaml
# Review:  .venv/bin/python -m studio episodes/blair_face_card.yaml --sheet
#
# Consistency rule from the script: Blair's big forehead, thin hair density, face and outfit never change.
# Only the *arrangement* of her hair changes (hair `style:`), plus temporary wind / volume.

title: "What's It Like to Have a Big Forehead and Thin Hair... But an Ethereal Face Card?"
fps: 24
size: [1080, 1920]
grade: {bloom: 0.22, grain: 0.07}
captions:
  enabled: true
  size: 74
  highlight: {forehead: "#ffd36a", hair: "#ff9fd6", card: "#ff7ac3", unlimited: "#ff7ac3", volume: "#c9b0ff",
              wind: "#9fd8ff", hater: "#9fd8ff", pretty: "#ff9fd6", gorgeous: "#ffd36a", out: "#ffd36a"}
music:
  seed: 11
  volume: 0.34
  sections:
    - {at: 0, style: pop}
    - {at: 49, style: comedy}
    - {at: 99, style: sad}
    - {at: 124, style: warm}
    - {at: 152, style: party}

cast:
  blair:
    voice: af_heart
    look: {skin: "#e7bf92", eye: "#a9b7c6", lips: "#f2669e", eyeshadow: "#d9b8ff", hair: "#8b7b70",
           hair_style: thin, part: -10, forehead: 1.0, eye_shape: feline, glow: 0.9, brow: "#5a4a44",
           top: corset, top_color: "#ff86bf", jacket: "#c9b0ff", bottom: mini, bottom_color: "#c7cbd6",
           bottom_metal: true, shoes: clear, earrings: silver}
  pink:
    voice: af_bella
    look: {skin: "#6b4028", eye: "#5a3a22", lips: "#c4366e", eyeshadow: "#ff7ac3", hair: "#24160f", hair_style: curly,
           top: halter, top_color: "#ff6fb5", bottom: mini, bottom_color: "#ff8fc8", shoes_color: "#ff6fb5",
           earrings: gold, brow: "#1e120c", glow: 0.4}
  blue:
    voice: af_kore
    look: {skin: "#f3d2b8", eye: "#3b2a20", lips: "#e8507a", eyeshadow: "#9fd0ff", hair: "#1b1820", hair_style: long,
           bangs: true, eye_shape: almond, part: 0, top: hoodie, top_color: "#8ec5ff", bottom: flare,
           bottom_color: "#bcd8f7", shoes_color: "#ffffff", earrings: silver, brow: "#1b1418", glow: 0.4}
  gold:
    voice: bf_isabella
    look: {skin: "#c98f62", eye: "#6b4a2a", lips: "#d9506a", eyeshadow: "#ffd36a", hair: "#4a2c1c", hair_style: long,
           wavy: 1.0, part: 12, top: halter, top_color: "#f4c542", top_metal: true, bottom: mini,
           bottom_color: "#f4c542", bottom_metal: true, shoes_color: "#f4c542", earrings: gold, brow: "#2a1a12",
           glow: 0.4}

shots:
  # ======================================================= SCENE 1 - WHAT'S IT LIKE? (0:00-0:25)
  - id: s1_mirror_open
    set: vanity
    mask: heart
    actors:
      - {who: blair, x: 720, y: 430, s: 0.6, expr: dreamy, face: {look_y: -0.1}}
    camera: {frame: cu, on: blair, push: 0.08}
    hook: {lines: ["WHAT'S IT LIKE...", "big forehead + thin hair", "but an ethereal", "FACE CARD?"], dur: 4.6}
    glitter: 0.35
    dur: 5.0
    sfx: [{at: 0.0, name: sparkle, gain: 0.7}]

  - id: s1_admire
    set: vanity
    mask: heart
    actors:
      - {who: blair, x: 720, y: 430, s: 0.6, expr: confident, arms: custom, arm_r: [96, 70, 1, true]}
    camera: {frame: ecu, on: blair, push: 0.06}
    beats:
      - {at: 1.2, who: blair, face: {wink: 1.0}, sfx: ding, gain: 0.6}
      - {at: 1.2, who: blair, fx: sparkles, fxdur: 1.5}
      - {at: 1.7, who: blair, face: {wink: 0.0}}
    leak: "#ffc4e6"
    dur: 3.0

