<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shorts3D Player</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; background: #0b0b0d; color: #ddd; font: 14px system-ui, sans-serif; }
  body.render { overflow: hidden; }
  #wrap { position: relative; margin: 0 auto; }
  #wrap canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  #bar { display: flex; gap: 12px; align-items: center; justify-content: center; padding: 10px; }
  #bar input[type=range] { width: min(70vw, 520px); }
  body.render #bar { display: none; }
</style>
<script type="importmap">
{ "imports": { "three": "../node_modules/three/build/three.module.js", "three/addons/": "../node_modules/three/examples/jsm/" } }
</script>
</head>
<body>
<div id="wrap"></div>
<div id="bar"><button id="play">Play</button><input id="scrub" type="range" min="0" max="1000" value="0"><span id="time">0.0 s</span></div>
<script type="module" src="./main.js"></script>
</body>
</html>
